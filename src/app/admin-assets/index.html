<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>管理画面 - Nakamaba</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script src="/theme.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Noto+Sans+JP:wght@300..700&display=swap"
    />
    <link rel="stylesheet" href="/admin.css" />
    <script src="/admin.js" defer></script>
  </head>
  <body>
    <nav class="nav">
      <span class="brand">Nakamaba</span>
      <span class="nav-right" id="nav-right">
        <span class="who" id="who"></span>
        <a class="public-link" id="public-link" href="/" target="_blank" rel="noopener noreferrer" hidden>公開ページ ↗</a>
        <button id="logout" type="button" hidden>ログアウト</button>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="ライトとダークを切り替える" title="ライトとダークを切り替える">
          <svg viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M10 3a7 7 0 0 1 0 14z" fill="currentColor" />
          </svg>
        </button>
      </span>
    </nav>

    <main class="main">
      <div class="status" id="status" role="status" aria-live="polite" hidden></div>

      <section class="panel login" id="login-panel" aria-labelledby="login-heading" hidden>
        <h1 id="login-heading">ログイン</h1>
        <form id="login-form" class="form">
          <label>
            <span>ユーザー名</span>
            <input id="login-name" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" />
          </label>
          <label>
            <span>パスワード</span>
            <input id="login-password" name="password" type="password" required autocomplete="current-password" />
          </label>
          <button class="primary" type="submit" id="login-button">ログイン</button>
        </form>
      </section>

      <div class="app" id="app" hidden>
      <section class="panel" aria-labelledby="publish-heading">
        <h1 id="publish-heading">ページを公開</h1>
        <p class="hint">
          zip の直下に <code>index.html</code> か <code>index.md</code> を置いてください。同じ名前で公開すると上書きします。
        </p>
        <p class="hint" id="usage"></p>
        <form id="publish-form" class="form">
          <label>
            <span>ページ名（英小文字・数字・ハイフン）</span>
            <input id="page-name" name="name" required maxlength="63" pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?" autocomplete="off" spellcheck="false" />
          </label>
          <label>
            <span>zip ファイル</span>
            <input id="page-zip" name="zip" type="file" accept=".zip,application/zip" required />
          </label>
          <button class="primary" type="submit" id="publish-button">公開する</button>
        </form>
      </section>

      <section class="panel" aria-labelledby="pages-heading">
        <h2 id="pages-heading">公開中のページ</h2>
        <div id="pages" class="rows"></div>
      </section>

      <section class="panel" aria-labelledby="tokens-heading">
        <h2 id="tokens-heading">エージェント用のトークン</h2>
        <p class="hint">
          AI エージェントが、あなたの名前でページを公開・更新するためのトークンです。トークンでは、ページの削除とユーザーの管理はできません。90 日使われなかったトークンは使えなくなります。
        </p>
        <form id="token-form" class="form inline">
          <label>
            <span>名前（何に使うか）</span>
            <input id="token-label" name="label" required maxlength="50" placeholder="例: Bobert" autocomplete="off" />
          </label>
          <button class="primary" type="submit" id="token-button">発行する</button>
        </form>
        <div id="token-issued" class="issued" hidden></div>
        <div id="tokens" class="rows"></div>
      </section>

      <section class="panel" id="users-panel" aria-labelledby="users-heading" hidden>
        <h2 id="users-heading">ユーザー</h2>
        <form id="user-form" class="form inline">
          <label>
            <span>ユーザー名</span>
            <input id="user-name" name="name" required maxlength="63" pattern="[a-z0-9]([a-z0-9\-]*[a-z0-9])?" autocomplete="off" spellcheck="false" />
          </label>
          <button class="primary" type="submit">追加する</button>
        </form>
        <div id="users" class="rows"></div>
      </section>
      </div>
    </main>
  </body>
</html>
