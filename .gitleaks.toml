title = "Nakamaba gitleaks config"

[extend]
useDefault = true

# 既定のルールは Discord の Webhook URL を拾わない
[[rules]]
id = "discord-webhook-url"
description = "Discord Webhook URL"
regex = '''https://(?:(?:ptb|canary)\.)?discord(?:app)?\.com/api/webhooks/\d+/[\w-]+'''
keywords = ["discord"]

# 管理画面で発行するエージェント用のトークン（src/app/tokens.ts と同じ形）
[[rules]]
id = "nakamaba-agent-token"
description = "Nakamaba のエージェント用のトークン"
regex = '''nkmb_[A-Za-z0-9_-]{43}'''
keywords = ["nkmb_"]
